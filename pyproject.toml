[project]
name = "c3p0"
version = "1.4.0"
description = "Self-hosted, multi-guild Discord bot"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    # [voice] extra pulls in PyNaCl and davey - discord.py>=2.7 hard-requires
    # davey (Discord's DAVE voice protocol library) to construct *any*
    # VoiceClient at all, not just for end-to-end-encrypted channels. Without
    # it every `!join`/`!play` fails with "davey library needed in order to
    # use voice", which discord.py only announces as a startup log warning,
    # not an import-time or install-time error - easy to miss.
    "discord.py[voice]>=2.4,<3.0",
    # [asyncio] pulls in greenlet, which the async engine needs - SQLAlchemy
    # 2.1 stopped installing it by default, so a fresh image build got 2.1
    # without greenlet and the bot crashed at import. Capped at 2.0.x (the
    # version the suite runs against) until 2.1 is deliberately tested.
    "SQLAlchemy[asyncio]>=2.0,<2.1",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.13,<2.0",
    "python-dotenv>=1.0,<2.0",
    "prometheus-client>=0.20,<1.0",
    "yt-dlp>=2024.8.6",
    # --- web dashboard (app/web, run as a separate process/container) ---
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27,<1.0",
]

[project.urls]
Homepage = "https://github.com/cm208/c3p0"
Repository = "https://github.com/cm208/c3p0"
Changelog = "https://github.com/cm208/c3p0/blob/main/CHANGELOG.md"
Issues = "https://github.com/cm208/c3p0/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "aiosqlite>=0.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# commands.parameter(...) is discord.py's documented way to attach a
# per-argument description (shown by !help) alongside a real default value,
# and Depends(...) is FastAPI's dependency-injection idiom - both are
# meant to be called in the default position. B008 doesn't know that and
# flags it as the general mutable/call-in-default-argument smell.
extend-immutable-calls = ["discord.ext.commands.parameter", "fastapi.Depends"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
